services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=StrongPassword123!
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    # SQL Server needs several seconds after the container starts before it accepts logins.
    # The services below wait for this check to pass.
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:alpine
    container_name: redis
    # AOF with "always": Redis writes each command to disk before acknowledging it, so an XADD
    # the outbox has already marked processed can't be lost in a crash. It costs throughput
    # compared to "everysec", which can lose about one second of writes.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  loan-service:
    build: ./loan-service
    container_name: loan-service
    environment:
      # Inside the compose network, other containers are reached by service name, not localhost.
      - ConnectionStrings__Loans=Server=sqlserver,1433;Database=Loans;User Id=sa;Password=StrongPassword123!;TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379
      # A fixed name, so unacked entries are still ours after the container is recreated.
      - LoanDecisionConsumer__ConsumerName=loan-service-1
    ports:
      - "5135:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  credit-check-worker:
    build: ./credit-check-worker
    container_name: credit-check-worker
    environment:
      - ConnectionStrings__Redis=redis:6379
      - CreditCheck__ConsumerName=credit-check-1
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure

volumes:
  sqlserver-data:
  redis-data:
